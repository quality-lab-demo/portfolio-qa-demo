<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>Error States — Portfolio QA Demo</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <header class="topbar"><a class="brand" href="index.html">QA / LAB</a><span class="demo-label">Trust check</span></header>
  <main class="case">
    <div class="case-head"><div><p class="eyebrow">ACCESSIBILITY · FORM FEEDBACK</p><h1>Error states need<br>more than color.</h1></div></div>
    <section class="comparison-grid">
      <article class="panel"><span class="tag fail">FAIL · COLOR ONLY</span><h2>Form error</h2><label class="field-label" for="bad-email">Email address</label><input class="error-input" id="bad-email" value="mina@"><p>The red border is the only signal.</p></article>
      <article class="panel"><span class="tag pass">PASS · TEXT + ICON</span><h2>Form error</h2><label class="field-label" for="good-email">Email address</label><p class="error-copy" id="good-error"><span aria-hidden="true">⚠</span> Enter a complete email address.</p><input class="error-input" id="good-email" value="mina@" aria-invalid="true" aria-describedby="good-error"></article>
    </section>
  </main>
</body>
</html>
